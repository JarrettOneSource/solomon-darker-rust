[build]
target = "index.html"
dist = "dist"
# Relative URLs let one build serve at the site root or below any mount, such as
# /game, /game-rust or /game-stg. The post-build hook requires this base.
public_url = "./"

[watch]
watch = ["index.html", "bootstrap.mjs", "../scripts/trunk_bootstrap.py", "../scripts/prepare-trunk-client.py", "../crates"]

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", 'exec python3 "$TRUNK_SOURCE_DIR/../scripts/prepare-trunk-client.py"']

[hooks.windows]
# Trunk runs hooks beside this config; keep the script path out of cmd quoting.
command = "python"
command_arguments = ["../scripts/prepare-trunk-client.py"]

[serve]
addresses = ["127.0.0.1"]
port = 4180
open = false
# Trunk's auto-reload is an inline script, which the post-build hook rejects.
no_autoreload = true
