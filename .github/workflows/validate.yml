name: Verify actual native fatal error visibility and saved return
on:
  push:
    branches: [diagnostic/windows-browser-capture-20261026]
permissions:
  contents: read
  actions: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'
jobs:
  native-fatal-status:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b8e90930e195b8f74e8492bd0bc6f0c8486940fa
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d
        with:
          setup-window-manager: 'true'
      - run: python -m pip install -r tools/desktop-smoke-requirements.txt
      - uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72
        with:
          version: '26.0.3'
      - name: Select native Windows Perl
        shell: pwsh
        run: |
          $nativePerl = (Get-Command perl -All | Where-Object Source -Like '*Strawberry*' | Select-Object -First 1).Source
          if (!$nativePerl) { throw 'Native Perl is unavailable.' }
          "OPENSSL_SRC_PERL=$nativePerl" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: rustup show
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-audio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-ebeea4e7479e56e6847ca777af4ed7314f0b2916
          restore-keys: |
            native-audio-${{ runner.os }}-${{ runner.arch }}-
            native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            native-${{ runner.os }}-${{ runner.arch }}-
      - name: Install verified private fixture
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess,hashlib,json
          revision=os.environ['GITHUB_SHA']
          subprocess.run(['git','fetch','--depth=1','origin',revision],check=True)
          hashes={'tools/diagnostic-native-audio.py': 'c92709243b717c6a9242468a7fb2d351a9a380f663c55262e6b265f3479b0987', 'tools/diagnostic-native-audio.rs': '879ce1543719f08c956c920e7969631f19ad1e0336a80994985ba57660b492ac', 'tools/diagnostic-fatal-status.patch': '4b6267403035c41a6636fec31e69ae1427d151e00fa68727dcfd3193b5ccb254', 'tools/diagnostic-fatal-status.py': '56530359c440e5a15d8f85abd07b4801acd82b5a7a26aa2eeea9d6e4c7cec321'}
          for name,digest in hashes.items():
              data=subprocess.check_output(['git','show',revision+':'+name])
              assert hashlib.sha256(data).hexdigest()==digest,name
              Path(name).write_bytes(data)
          out=Path('reports/native-fatal-status');out.mkdir(parents=True,exist_ok=True)
          (out/'source.json').write_text(json.dumps({'base':'b8e90930e195b8f74e8492bd0bc6f0c8486940fa','fixtureRevision':revision,'fixtureHashes':hashes},indent=2)+'\n')
      - name: Apply the already-verified error handling and layout
        shell: python
        run: |
          import subprocess
          for script,mode in [('tools/diagnostic-native-audio.py','red'),('tools/diagnostic-native-audio.py','green'),('tools/diagnostic-fatal-status.py','red'),('tools/diagnostic-fatal-status.py','green')]:
              subprocess.run(['python',script,mode],check=True)
      - name: Build the private fatal-frame fixture
        shell: pwsh
        run: |
          python tools/diagnostic-fatal-status.py inject
          if ($LASTEXITCODE) { throw 'Fixture installation failed.' }
          node tools/package-desktop.mjs --platform win32 --arch x64 --release-repository "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE) { throw 'Native fixture build failed.' }
      - name: Verify actual error visibility and save before returning to launcher
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess
          env=os.environ.copy();env['SDR_DESKTOP_EVIDENCE']=str(Path('reports/native-fatal-status/journey').resolve())
          env['SDR_FATAL_STATUS_TRIGGER']=str(Path('reports/native-fatal-status/trigger').resolve())
          subprocess.run(['python','tools/smoke-desktop-runtime.py'],env=env,check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fatal-status-windows
          path: reports/native-fatal-status
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fatal-fixture-executable
          path: target/release/solomon-darker-app.exe
          if-no-files-found: ignore
