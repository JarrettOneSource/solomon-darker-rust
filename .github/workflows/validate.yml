name: Verify saved recovery from the retained native fatal fixture
on:
  push:
    branches: [diagnostic/windows-browser-capture-20261026]
permissions:
  contents: read
  actions: read
jobs:
  native-fatal-status:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b8e90930e195b8f74e8492bd0bc6f0c8486940fa
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d
        with:
          setup-window-manager: 'true'
      - run: python -m pip install -r tools/desktop-smoke-requirements.txt
      - uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72
        with:
          version: '26.0.3'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40451086793
          name: native-fatal-fixture-executable
          path: retained-executable
      - name: Verify retained executable and install the private journey
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess
          binaries=list(Path('retained-executable').rglob('*.exe'))
          assert len(binaries)==1
          binary=binaries[0].resolve()
          executable_hash=hashlib.sha256(binary.read_bytes()).hexdigest()
          assert executable_hash=='48c263f9cc028ed4d140de6f1eaabe8e373ef4e66cc08b94e71a22ef209e473f'
          revision=os.environ['GITHUB_SHA']
          subprocess.run(['git','fetch','--depth=1','origin',revision],check=True)
          name='tools/diagnostic-fatal-journey.py'
          data=subprocess.check_output(['git','show',revision+':'+name])
          fixture_hash=hashlib.sha256(data).hexdigest()
          assert fixture_hash=='117348c7f3f4ea762d260c992b2d2797ec04a994c71c24e2f5192d5528b2c8de'
          Path(name).write_bytes(data)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('FATAL_NATIVE_APP='+str(binary)+'\n')
          out=Path('reports/native-fatal-status');out.mkdir(parents=True,exist_ok=True)
          (out/'source.json').write_text(json.dumps({'base':'b8e90930e195b8f74e8492bd0bc6f0c8486940fa','retainedBuildRun':40451086793,'executableSha256':executable_hash,'fixtureRevision':revision,'fixtureSha256':fixture_hash},indent=2)+'\n')
      - name: Stage the existing executable with its unchanged assets
        shell: pwsh
        run: |
          node tools/package-desktop.mjs --platform win32 --arch x64 --native-app "$env:FATAL_NATIVE_APP" --release-repository "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE) { throw 'Retained native fixture packaging failed.' }
      - name: Verify actual text pixels, accessible status, durable save and launcher return
        shell: pwsh
        run: |
          python -u tools/diagnostic-fatal-journey.py
          if ($LASTEXITCODE) { throw 'Native fatal recovery journey failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fatal-status-windows
          path: reports/native-fatal-status
          if-no-files-found: error
