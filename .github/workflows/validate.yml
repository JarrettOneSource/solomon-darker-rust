{
  "name": "Verify direct Mac window lookup",
  "on": {
    "push": {
      "branches": [
        "diagnostic/windows-media-seek-20261027"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "mac-window-diagnostic": {
      "runs-on": "macos-15-intel",
      "timeout-minutes": 40,
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Resolve accessibility interpreter",
          "run": "python3 -c 'import os,sys; print(\"TCC_CLIENT=\" + os.path.realpath(sys.executable))' >> \"$GITHUB_ENV\""
        },
        {
          "uses": "xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d",
          "with": {
            "macos-tcc-client": "${{ env.TCC_CLIENT }}"
          }
        },
        {
          "run": "python3 -m pip install -r tools/desktop-smoke-requirements.txt"
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "desktop-darwin-x64",
            "path": "reports/package-download",
            "run-id": 40497735544,
            "github-token": "${{ github.token }}"
          }
        },
        {
          "name": "Verify and extract the published ordinary package",
          "shell": "bash",
          "run": "(cd reports/package-download && shasum -a 256 -c Solomon-Darker-darwin-x64.zip.sha256)\nditto -xk reports/package-download/Solomon-Darker-darwin-x64.zip reports/package"
        },
        {
          "name": "Validate the unchanged assets and diagnostic syntax",
          "run": "python3 scripts/verify-client-assets.py\npython3 -m py_compile tools/smoke-desktop-runtime.py tools/diagnostic-mac-windows.py"
        },
        {
          "name": "Compare both native window discovery paths during the complete journey",
          "env": {
            "SDR_DESKTOP_APP": "reports/package/Solomon Darker-darwin-x64",
            "SDR_DESKTOP_EVIDENCE": "reports/desktop-smoke"
          },
          "run": "python3 tools/diagnostic-mac-windows.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "mac-window-diagnostic",
            "path": "reports/desktop-smoke",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
