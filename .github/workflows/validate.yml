name: Verify retired music seek and real browser continuation
on:
  push:
    branches: [diagnostic/windows-browser-capture-20261026]
permissions:
  contents: read
  actions: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'
jobs:
  browser-admission:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b8e90930e195b8f74e8492bd0bc6f0c8486940fa
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Select native Windows Perl
        shell: pwsh
        run: |
          $nativePerl = (Get-Command perl -All | Where-Object Source -Like '*Strawberry*' | Select-Object -First 1).Source
          if (!$nativePerl) { throw 'The runner has no Strawberry Perl installation.' }
          "OPENSSL_SRC_PERL=$nativePerl" >> $env:GITHUB_ENV
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-b8e90930e195b8f74e8492bd0bc6f0c8486940fa
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - run: rustup show
      - uses: actions/download-artifact@v4
        with:
          name: browser-client-green
          path: web/dist
          run-id: 40432773454
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: browser-green-source
          path: reports/browser-admission/browser-source
          run-id: 40432773454
          github-token: ${{ github.token }}
      - name: Verify browser source and install private ordinary-input fixture
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess,shutil
          root=Path.cwd();output=Path('reports/browser-admission')
          source=json.loads((output/'browser-source/source.json').read_text())
          line_endings=[]
          for name,digest in source['hashes'].items():
              canonical=subprocess.check_output(['git','show','HEAD:'+name])
              actual=Path(name).read_bytes()
              assert hashlib.sha256(canonical).hexdigest()==digest,name
              assert actual.replace(b'\r\n',b'\n')==canonical,name
              if actual!=canonical: line_endings.append(name)
          (output/'checkout-verification.json').write_text(json.dumps({'canonicalSourceHashesMatch':True,'onlyLineEndingsDiffer':line_endings},indent=2)+'\n')
          revision=os.environ['GITHUB_SHA']
          subprocess.run(['git','fetch','--depth=1','origin',revision],check=True)
          fixtures={'tools/browser-smoke/native-admission-acceptance.cjs': 'addd82bc3d024c44921d06b3550896edad22fe2d8366f5ab33110d8472111d86', 'tools/browser-smoke/native-admission-windows.py': 'fceae648a3aa8f3bdb1f61a10c2ed97fde09cda73eeb1570b1f1e002a1dd0489', 'tools/browser-smoke/browser-lifecycle.cjs': '5612c45de33878934cf2af94890296669565e407afb5777778e92a482e55642b', 'tools/browser-smoke/browser-errors.cjs': '14bddcb38b05ac5b9d932af6d5d69c6990ee04b54ab90d5b37e266c2cbee3ab0', 'tools/browser-smoke/browser-errors.test.cjs': 'a184b49a7d58a4a865be331b5317a26cb7bf7ab9c6f4ca82c4c4298c6af3e52a', 'tools/browser-smoke/diagnostic-browser-errors-green.cjs': '19e152ae17d7587f76da6b81652dfffc2c9ea7627330167091dabcd27f942e0d', 'tools/browser-smoke/diagnostic-retired-rewind.json': 'd3050c5bb86f496a2b364155e851ca3782ce0d1daa1171d44dd342fd3e25a086', 'tools/browser-smoke/diagnostic-retired-rewind.cjs': '2a75132f465cbc6294f07ea03e6a749fe0b1aeaffb9c09574734f51d3da734e0'}
          for name,digest in fixtures.items():
              data=subprocess.check_output(['git','show',revision+':'+name])
              assert hashlib.sha256(data).hexdigest()==digest,name
              Path(name).write_bytes(data)
          shutil.copytree('web/assets','web/dist/assets',dirs_exist_ok=True)
          receipt={'hostSource':'b8e90930e195b8f74e8492bd0bc6f0c8486940fa','browserRun':40432773454,'browserSourceMatchesHostCheckout':True,'fixtureRevision':revision,'fixtureHashes':fixtures}
          (output/'source.json').write_text(json.dumps(receipt,indent=2)+'\n')
      - name: Prove the captured rewind is rejected before the correction
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          result=subprocess.run(['node','--test','tools/browser-smoke/browser-errors.test.cjs'],capture_output=True,text=True)
          Path('reports/browser-admission/red.log').write_text(result.stdout+result.stderr)
          print(result.stdout+result.stderr)
          assert result.returncode!=0,'The original classifier unexpectedly passed'
          assert 'not ok' in result.stdout and 'replacement retires a loaded channel whose paused rewind is still seeking' in result.stdout
      - name: Verify corrected classification, strict rejection cases and captured evidence
        shell: python
        run: |
          from pathlib import Path
          import subprocess,shutil
          shutil.copyfile('tools/browser-smoke/diagnostic-browser-errors-green.cjs','tools/browser-smoke/browser-errors.cjs')
          result=subprocess.run(['npm.cmd','run','test:browser-support'],capture_output=True,text=True)
          Path('reports/browser-admission/green.log').write_text(result.stdout+result.stderr)
          print(result.stdout+result.stderr)
          assert result.returncode==0,'Browser support regression failed'
          subprocess.run(['node','tools/browser-smoke/diagnostic-retired-rewind.cjs'],check=True)
      - name: Build the unchanged real Windows authority
        run: cargo build --locked -p solomon-launcher --bin solomon-darker
      - name: Record the real host executable
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json
          p=Path('reports/browser-admission/source.json');s=json.loads(p.read_text())
          s['hostSha256']=hashlib.sha256(Path('target/debug/solomon-darker.exe').read_bytes()).hexdigest()
          s['hostUnmodified']=True
          p.write_text(json.dumps(s,indent=2)+'\n')
      - name: Exercise real browser admission, save and fresh-document continuation
        run: python tools/browser-smoke/native-admission-windows.py
      - name: Retain Windows browser and host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-native-admission-windows
          path: reports/browser-admission
          if-no-files-found: error
