name: Diagnose Windows transport

on:
  push:
    branches: [diagnostic/windows-transport-20261021]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  windows-transport:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Observe Windows idle receive and subsequent bidirectional traffic
        run: |
          rustc --edition 2024 scripts/windows-tcp-timeout-probe.rs -o windows-tcp-timeout-probe.exe
          ./windows-tcp-timeout-probe.exe
      - name: Run the existing real WebSocket transport contracts
        if: ${{ always() }}
        run: cargo test -p solomon-launcher --lib transport::tests -- --nocapture --test-threads=1
