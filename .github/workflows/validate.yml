{
  "name": "Observe Windows browser socket resources",
  "on": {
    "push": {
      "branches": [
        "diagnostic/windows-browser-capture-20261026"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "browser-buffer-windows": {
      "runs-on": "windows-latest",
      "timeout-minutes": 40,
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "4e0701fb6d7d6517991c3112ae84c26462caeece"
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "22.17.0"
          }
        },
        {
          "run": "npm ci --no-audit --no-fund"
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "browser-client",
            "path": "web/dist",
            "run-id": 40466361015,
            "github-token": "${{ github.token }}"
          }
        },
        {
          "name": "Install private observer against unchanged source",
          "shell": "python",
          "run": "from pathlib import Path\nimport hashlib,os,shutil,subprocess\nrevision=os.environ['GITHUB_SHA']\nsubprocess.run(['git','fetch','--depth=1','origin',revision],check=True)\ndata=subprocess.check_output(['git','show',revision+':tools/diagnostic-browser-buffer.py'])\nassert hashlib.sha256(data).hexdigest()=='df3a0fde16e07dffe971c0964e35d636c54731500ac0f2a3a2fd6365c06ef095'\nPath('tools/diagnostic-browser-buffer.py').write_bytes(data)\nshutil.copytree('web/assets','web/dist/assets',dirs_exist_ok=True)\n"
        },
        {
          "name": "Observe two original acceptance sequences",
          "shell": "pwsh",
          "run": "$env:PW = Join-Path $env:GITHUB_WORKSPACE 'node_modules/playwright-core'\n$env:CHROME = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'\nif (!(Test-Path $env:CHROME)) { throw 'Chrome is unavailable.' }\npython tools/diagnostic-browser-buffer.py\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "browser-buffer-windows",
            "path": "reports/browser-buffer",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
