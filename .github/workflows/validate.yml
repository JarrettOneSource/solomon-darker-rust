name: Observe native peer input while checking capture recovery
on:
  push:
    branches: [diagnostic/windows-browser-capture-20261026]
permissions:
  contents: read
  actions: read
jobs:
  native-accessibility-macos:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 33ca699899158bae7d880a5fda605c92849e7eef
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve the accessibility interpreter
        run: python -c 'import os,sys; print("TCC_CLIENT=" + os.path.realpath(sys.executable))' >> "$GITHUB_ENV"
      - uses: xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d
        with:
          setup-window-manager: 'true'
          macos-tcc-client: ${{ env.TCC_CLIENT }}
      - run: python -m pip install -r tools/desktop-smoke-requirements.txt
      - name: Install the verified private driver check
        id: fixture
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess
          revision=os.environ['GITHUB_SHA']
          subprocess.run(['git','fetch','--depth=1','origin',revision],check=True)
          name='tools/diagnostic-native-accessibility.py'
          data=subprocess.check_output(['git','show',revision+':'+name])
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='eb1ce3629d6b8f33c10337d7c787c258f0ad3d4c16aafcea7d313ec99295fb46'
          Path(name).write_bytes(data)
          out=Path('reports/native-accessibility');out.mkdir(parents=True,exist_ok=True)
          (out/'source.json').write_text(json.dumps({'sourceRevision':'33ca699899158bae7d880a5fda605c92849e7eef','fixtureRevision':revision,'fixtureSha256':digest,'packageRun':40450038601,'packageArtifact':'unqualified-desktop-darwin-arm64-40450038601-1'},indent=2)+'\n')
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40450038601
          name: unqualified-desktop-darwin-arm64-40450038601-1
          path: retained-package
      - name: Verify and unpack the unchanged native package
        id: unpack
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess
          archive=Path('retained-package/Solomon-Darker-darwin-arm64.zip')
          expected=Path(str(archive)+'.sha256').read_text().split()[0]
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream,'sha256').hexdigest()==expected
          inspection=subprocess.check_output(['python','scripts/verify-desktop-archive.py',str(archive)],text=True)
          report=json.loads(inspection)
          assert report['revision']=='33ca699899158bae7d880a5fda605c92849e7eef'
          assert report['nativeSha256']=='a0936ba4defb005abc55299338f1d342ad771e5376d58bacfd822a0002415036'
          Path('reports/native-accessibility/archive-inspection.json').write_text(inspection)
          subprocess.run(['ditto','-x','-k',str(archive),'retained-package/unpacked'],check=True)
          app=Path('retained-package/unpacked/Solomon Darker-darwin-arm64').resolve()
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('SDR_DESKTOP_APP='+str(app)+'\n')
      - name: Record durable input during the original fixed-duration key hold
        if: always() && steps.fixture.outcome == 'success' && steps.unpack.outcome == 'success'
        run: python -u tools/diagnostic-native-accessibility.py capture
      - name: Observe the same input until actual durable movement with a ten-second cap
        if: always() && steps.fixture.outcome == 'success' && steps.unpack.outcome == 'success'
        run: python -u tools/diagnostic-native-accessibility.py observed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-accessibility-macos
          path: reports/native-accessibility
          if-no-files-found: error
