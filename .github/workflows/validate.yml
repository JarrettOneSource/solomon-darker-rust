{
  "name": "Trace input after delayed native admission",
  "on": {
    "push": {
      "branches": [
        "diagnostic/native-admission-20261027"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "CARGO_INCREMENTAL": "0",
    "CARGO_PROFILE_DEV_DEBUG": "0",
    "CARGO_PROFILE_TEST_DEBUG": "0",
    "RUST_BACKTRACE": "1"
  },
  "jobs": {
    "native-admission": {
      "runs-on": "macos-15-intel",
      "timeout-minutes": 90,
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Resolve accessibility interpreter",
          "run": "python3 -c 'import os,sys; print(\"TCC_CLIENT=\" + os.path.realpath(sys.executable))' >> \"$GITHUB_ENV\""
        },
        {
          "uses": "xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d",
          "with": {
            "macos-tcc-client": "${{ env.TCC_CLIENT }}"
          }
        },
        {
          "run": "python3 -m pip install -r tools/desktop-smoke-requirements.txt"
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version-file": ".node-version",
            "cache": "npm"
          }
        },
        {
          "run": "npm install --global npm@10.9.2"
        },
        {
          "run": "npm ci --no-audit --no-fund"
        },
        {
          "run": "rustup show"
        },
        {
          "run": "python3 scripts/verify-client-assets.py\npython3 -m py_compile tools/diagnostic-native-admission.py\ncargo fmt --all -- --check"
        },
        {
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": "~/.cargo/registry\n~/.cargo/git\ntarget",
            "key": "native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}",
            "restore-keys": "native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-\nnative-${{ runner.os }}-${{ runner.arch }}-"
          }
        },
        {
          "name": "Build the traced native app",
          "run": "npm run package:desktop -- --platform darwin --arch x64 --release-repository \"$GITHUB_REPOSITORY\""
        },
        {
          "name": "Archive the diagnostic package",
          "run": "node tools/archive-desktop.mjs"
        },
        {
          "name": "Verify delayed admission, movement, saving and fresh continuation",
          "timeout-minutes": 25,
          "run": "python3 tools/diagnostic-native-admission.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "native-admission-input-trace",
            "path": "reports/desktop-smoke",
            "if-no-files-found": "warn"
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "unqualified-native-admission-input-package",
            "path": "dist-desktop/*.zip\ndist-desktop/*.sha256\ndist-desktop/desktop-release.json",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
