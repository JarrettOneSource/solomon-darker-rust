name: Observe Windows local asset response phases

on:
  push:
    branches: [diagnostic/windows-browser-capture-20261026]

permissions:
  contents: read
  actions: read

jobs:
  browser-server:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b8e90930e195b8f74e8492bd0bc6f0c8486940fa
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: browser-client-green
          path: web/dist
          run-id: 40432773454
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: browser-green-source
          path: reports/browser-server/browser-source
          run-id: 40432773454
          github-token: ${{ github.token }}
      - name: Install verified private observation fixture
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess,hashlib,json
          revision=os.environ['GITHUB_SHA']
          subprocess.run(['git','fetch','--depth=1','origin',revision],check=True)
          hashes={'tools/browser-smoke/observe-loading.cjs': 'ccfbfa0fdbb8ca3a3c6a86ed7d459568490aaac06ae6c376aa473ad482ccf9fd', 'tools/browser-smoke/observe-reload.cjs': '1a12d45b15eb1c790ae3c42d64c3d6515386b3cdbd5c185e1a798b826ae9b6a1', 'tools/browser-smoke/observe-server.py': '118cc9b822618cfe182a1ada27274f6782c6c817c6a6b6beaad74ae797dc3eb1', 'tools/browser-smoke/observe-windows-processes.py': 'f2ada154b170032db999415c117d5812af95e4d857f035f3548d5eb2a57b9118', 'tools/browser-smoke/observe-server-windows.py': '15385d23db33a7bf7ece5a14376291780c11433f70dbfa5bbe8b2e1732e57cf8'}
          for name,digest in hashes.items():
              data=subprocess.check_output(['git','show',revision+':'+name])
              assert hashlib.sha256(data).hexdigest()==digest,name
              Path(name).write_bytes(data)
          out=Path('reports/browser-server');out.mkdir(parents=True,exist_ok=True)
          (out/'source.json').write_text(json.dumps({'base':'b8e90930e195b8f74e8492bd0bc6f0c8486940fa','observationRevision':revision,'fixtureHashes':hashes},indent=2)+'\n')
      - name: Verify exact runtime sources and prepare tracked assets
        shell: python
        run: |
          from pathlib import Path
          import json,hashlib,subprocess,shutil
          source=json.loads(Path('reports/browser-server/browser-source/source.json').read_text())
          for name,digest in source['hashes'].items():
              data=subprocess.check_output(['git','show','HEAD:'+name])
              assert hashlib.sha256(data).hexdigest()==digest,name
          shutil.copytree('web/assets','web/dist/assets',dirs_exist_ok=True)
      - name: Observe bounded reload, server phases and native CPU counters
        run: python tools/browser-smoke/observe-server-windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-server-windows
          path: reports/browser-server
          if-no-files-found: error
