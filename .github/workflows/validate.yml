{
  "name": "Probe Windows raw socket port randomization",
  "on": {
    "push": {
      "branches": [
        "diagnostic/windows-media-seek-20261027"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "winsock-windows": {
      "runs-on": "windows-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Validate private Winsock probe syntax",
          "run": "python -m py_compile tools/diagnostic-winsock.py"
        },
        {
          "name": "Measure randomized, unset and restored Windows sockets",
          "run": "python tools/diagnostic-winsock.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "windows-winsock",
            "path": "reports/winsock",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
