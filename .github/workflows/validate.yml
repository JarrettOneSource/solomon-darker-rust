{
  "name": "Probe Windows loopback port randomization",
  "on": {
    "push": {
      "branches": [
        "diagnostic/windows-media-seek-20261027"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "socket-buffer-windows": {
      "runs-on": "windows-latest",
      "timeout-minutes": 40,
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "22.17.0"
          }
        },
        {
          "run": "npm ci --no-audit --no-fund"
        },
        {
          "name": "Validate the private probe syntax",
          "run": "node --check tools/diagnostic-socket-buffer.cjs\npython -m py_compile tools/diagnostic-socket-buffer.py"
        },
        {
          "name": "Measure default, disabled and restored port randomization",
          "shell": "pwsh",
          "run": "$env:PW = Join-Path $env:GITHUB_WORKSPACE 'node_modules/playwright-core'\n$env:CHROME = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'\nif (!(Test-Path $env:CHROME)) { throw 'Chrome is unavailable.' }\npython tools/diagnostic-socket-buffer.py\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "windows-socket-buffer",
            "path": "reports/socket-buffer",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
