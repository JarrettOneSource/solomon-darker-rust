{
  "name": "Check observed peer movement on the original Intel package",
  "on": {
    "push": {
      "branches": [
        "diagnostic/peer-input-20261030"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "observe": {
      "runs-on": "macos-15-intel",
      "timeout-minutes": 40,
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Resolve accessibility interpreter",
          "run": "python3 -c 'import os,sys; print(\"TCC_CLIENT=\" + os.path.realpath(sys.executable))' >> \"$GITHUB_ENV\""
        },
        {
          "uses": "xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d",
          "with": {
            "macos-tcc-client": "${{ env.TCC_CLIENT }}"
          }
        },
        {
          "run": "python3 -m pip install -r tools/desktop-smoke-requirements.txt"
        },
        {
          "name": "Download the original unqualified package",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "gh run download 41114455330 --repo \"$GITHUB_REPOSITORY\" --name unqualified-desktop-darwin-x64-41114455330-1 --dir input"
        },
        {
          "name": "Validate diagnostic source",
          "run": "python3 -m py_compile tools/diagnostic-peer-input.py\npython3 tools/diagnostic-peer-input.py --check"
        },
        {
          "name": "Check one full journey using saved movement observations",
          "timeout-minutes": 30,
          "run": "python3 tools/diagnostic-peer-input.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "intel-peer-movement-observed-checkpoint",
            "path": "reports/desktop-smoke",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
