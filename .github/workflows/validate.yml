name: Verify bounded browser acceptance and visible native failures
on:
  push:
    branches: [diagnostic/windows-browser-capture-20261026]
permissions:
  contents: read
  actions: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'
jobs:
  browser-fixed:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b8e90930e195b8f74e8492bd0bc6f0c8486940fa
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: browser-client-green
          path: web/dist
          run-id: 40432773454
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: browser-green-source
          path: reports/browser-fixed/browser-source
          run-id: 40432773454
          github-token: ${{ github.token }}
      - name: Install verified private fixture
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess,hashlib,json
          revision=os.environ['GITHUB_SHA']
          subprocess.run(['git','fetch','--depth=1','origin',revision],check=True)
          hashes={'scripts/serve-client.py': '5c7dd7a96e86f975136cd4047ead3462b2825ba162de56da6f75c535b669b276', 'tools/browser-smoke/browser-lifecycle.cjs': 'c657d88679be476787835a7bc9243cded1642dde67ef47eb66a2745c8f4af1b7', 'tools/browser-smoke/browser-errors.cjs': '14bddcb38b05ac5b9d932af6d5d69c6990ee04b54ab90d5b37e266c2cbee3ab0', 'tools/browser-smoke/smoke.cjs': 'a4927e78d253c1b46b217848a18cbbde5c625df6aec69feebada229868b16d81', 'tools/browser-smoke/diagnostic-software-gpu.cjs': 'f59e0fa688d39ad85ad6736b1ac229cb166f841a2b79dcc5fca7933c1cd6d865'}
          for name,digest in hashes.items():
              data=subprocess.check_output(['git','show',revision+':'+name])
              assert hashlib.sha256(data).hexdigest()==digest,name
              Path(name).write_bytes(data)
          out=Path('reports/browser-fixed');out.mkdir(parents=True,exist_ok=True)
          (out/'source.json').write_text(json.dumps({'base':'b8e90930e195b8f74e8492bd0bc6f0c8486940fa','fixtureRevision':revision,'fixtureHashes':hashes},indent=2)+'\n')
      - name: Verify exact runtime sources and prepare tracked assets
        shell: python
        run: |
          from pathlib import Path
          import json,hashlib,subprocess,shutil
          source=json.loads(Path('reports/browser-fixed/browser-source/source.json').read_text())
          for name,digest in source['hashes'].items():
              data=subprocess.check_output(['git','show','HEAD:'+name])
              assert hashlib.sha256(data).hexdigest()==digest,name
          shutil.copytree('web/assets','web/dist/assets',dirs_exist_ok=True)
      - run: npm run test:browser-support
      - name: Verify pre-page GPU setup and the original browser journeys
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess,json,time,urllib.request
          root=Path.cwd();out=root/'reports/browser-fixed'
          env=os.environ.copy()
          env.update(PW=str(root/'node_modules/playwright-core'),CHROME=str(Path(os.environ['ProgramFiles'])/'Google/Chrome/Application/chrome.exe'),URL='http://127.0.0.1:4181/',OUT=str(out))
          subprocess.run(['node','tools/browser-smoke/diagnostic-software-gpu.cjs'],env=env,check=True)
          receipt={'journeys':[]}
          with (out/'server.log').open('w') as log:
              server=subprocess.Popen(['python','scripts/serve-client.py','4181','--bind','127.0.0.1','--directory','web/dist'],stdout=log,stderr=subprocess.STDOUT)
              try:
                  deadline=time.monotonic()+30
                  while True:
                      if server.poll() is not None:raise RuntimeError('Server exited before readiness')
                      try:
                          with urllib.request.urlopen(env['URL'],timeout=1) as response:assert response.status==200
                          break
                      except OSError:
                          if time.monotonic()>=deadline:raise
                          time.sleep(.1)
                  for name,script in [('gameplay','smoke.cjs'),('settings','settings-parity.cjs'),('image-load-failure','image-load-failure.cjs')]:
                      env['OUT']=str(out/name)
                      result=subprocess.run(['node','tools/browser-smoke/'+script],env=env)
                      receipt['journeys'].append({'name':name,'exit':result.returncode})
              finally:
                  receipt['serverAliveUntilCleanup']=server.poll() is None
                  if server.poll() is None:server.terminate()
                  receipt['serverExit']=server.wait(timeout=15)
                  (out/'driver-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          assert all(row['exit']==0 for row in receipt['journeys']),receipt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-fixed-windows
          path: reports/browser-fixed
          if-no-files-found: error

  native-fatal-status:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b8e90930e195b8f74e8492bd0bc6f0c8486940fa
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d
        with:
          setup-window-manager: 'true'
      - run: python -m pip install -r tools/desktop-smoke-requirements.txt
      - uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72
        with:
          version: '26.0.3'
      - name: Select native Windows Perl
        shell: pwsh
        run: |
          $nativePerl = (Get-Command perl -All | Where-Object Source -Like '*Strawberry*' | Select-Object -First 1).Source
          if (!$nativePerl) { throw 'Native Perl is unavailable.' }
          "OPENSSL_SRC_PERL=$nativePerl" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: rustup show
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-audio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-ebeea4e7479e56e6847ca777af4ed7314f0b2916
          restore-keys: |
            native-audio-${{ runner.os }}-${{ runner.arch }}-
            native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            native-${{ runner.os }}-${{ runner.arch }}-
      - name: Install verified private fixture
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess,hashlib,json
          revision=os.environ['GITHUB_SHA']
          subprocess.run(['git','fetch','--depth=1','origin',revision],check=True)
          hashes={'tools/diagnostic-native-audio.py': 'c92709243b717c6a9242468a7fb2d351a9a380f663c55262e6b265f3479b0987', 'tools/diagnostic-native-audio.rs': '879ce1543719f08c956c920e7969631f19ad1e0336a80994985ba57660b492ac', 'tools/diagnostic-fatal-status.patch': '4b6267403035c41a6636fec31e69ae1427d151e00fa68727dcfd3193b5ccb254', 'tools/diagnostic-fatal-status.py': 'f5f847f4d868a1634bcd4c5afffdc41a277630f1944ffae5b70f307fdb46b13c'}
          for name,digest in hashes.items():
              data=subprocess.check_output(['git','show',revision+':'+name])
              assert hashlib.sha256(data).hexdigest()==digest,name
              Path(name).write_bytes(data)
          out=Path('reports/native-fatal-status');out.mkdir(parents=True,exist_ok=True)
          (out/'source.json').write_text(json.dumps({'base':'b8e90930e195b8f74e8492bd0bc6f0c8486940fa','fixtureRevision':revision,'fixtureHashes':hashes},indent=2)+'\n')
      - name: Reproduce the hidden failure layout
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          subprocess.run(['python','tools/diagnostic-native-audio.py','red'],check=True)
          subprocess.run(['python','tools/diagnostic-native-audio.py','green'],check=True)
          subprocess.run(['python','tools/diagnostic-fatal-status.py','red'],check=True)
          result=subprocess.run(['cargo','test','-p','solomon-web','--all-features','fatal_status_stays_readable_above_the_desktop_actions','--','--nocapture'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          Path('reports/native-fatal-status/red.log').write_text(result.stdout)
          print(result.stdout[-6000:])
          assert result.returncode != 0
          assert 'fatal_status_stays_readable_above_the_desktop_actions ... FAILED' in result.stdout
      - name: Verify the centered failure layout and native web suite
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          subprocess.run(['python','tools/diagnostic-fatal-status.py','green'],check=True)
          result=subprocess.run(['cargo','test','-p','solomon-web','--all-features'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          Path('reports/native-fatal-status/green.log').write_text(result.stdout)
          print(result.stdout[-6000:])
          assert result.returncode == 0
      - name: Build the private fatal-frame fixture
        shell: pwsh
        run: |
          python tools/diagnostic-fatal-status.py inject
          if ($LASTEXITCODE) { throw 'Fixture installation failed.' }
          npm run package:desktop -- --platform win32 --arch x64 --release-repository "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE) { throw 'Native fixture build failed.' }
      - name: Verify actual error visibility and save before returning to launcher
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess
          env=os.environ.copy();env['SDR_DESKTOP_EVIDENCE']=str(Path('reports/native-fatal-status/journey').resolve())
          subprocess.run(['python','tools/smoke-desktop-runtime.py'],env=env,check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fatal-status-windows
          path: reports/native-fatal-status
          if-no-files-found: error
