name: Diagnose packaged Windows authority

on:
  push:
    branches: [diagnostic/windows-fixed-retake-20261022]

permissions:
  contents: read
  actions: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.2
      - run: npm ci --no-audit --no-fund
      - name: Verify the exact maintained desktop harness before its uninstrumented retake
        run: |
          python - <<'PYHARNESS'
          from pathlib import Path
          import hashlib, json
          import subprocess
          expected = {'tools/smoke-desktop-runtime.mjs': 'fb65f2ec7a22a507932a03697cfeee9998cd0b899f8531957aa2b710700859d8', 'tools/browser-smoke/desktop-failure.cjs': '8cbc659f327df3426ef4c70a71f2e5a8f1e8568236b18a4689c4ca232b0c1b82', 'tools/browser-smoke/desktop-failure.test.cjs': '7f1010e30505261a82d55a9dd8d62b6101ae511051ec204164f828a549c5c0a0', 'tools/browser-smoke/native-child.cjs': 'dad8a00c95c27ecd7deaf10852aac782c44fe12806cd8d430a4af37ea7996e09', 'tools/browser-smoke/native-child.test.cjs': '1fd1c039e20a3a25b03a72342bb0163f7b30c7ee80c11fb30b62b8102bd1d0fb', 'package.json': 'd2f4a04ac4045eade4b6905ab5514b2138118f832544abaffcb855bc42c426ef', 'web/index.html': 'a11ba78d910a61546dd70944d335f7e4eb0c0dc63bdea79104a89ad88fe0bf5f', 'web/desktop-update.css': 'c0f11f6098434ec36d89e7d755366bc4ec978415e0e71167224b8e90cb86982a'}
          observed = []
          for name, digest in expected.items():
              raw = Path(name).read_bytes()
              canonical = raw.replace(b'\r\n', b'\n')
              actual = hashlib.sha256(canonical).hexdigest()
              assert actual == digest, (name, actual, digest)
              assert canonical == subprocess.check_output(['git', 'show', 'HEAD:' + name]), name
              observed.append({'path': name, 'canonicalSha256': actual, 'checkoutSha256': hashlib.sha256(raw).hexdigest()})
          Path('reports/desktop-smoke').mkdir(parents=True, exist_ok=True)
          Path('reports/desktop-smoke/maintained-harness.json').write_text(json.dumps({'sourceCommit': 'ec166dc625618dfcdda83e77206f879b1b2b2947', 'files': observed, 'normalization': 'only Windows CRLF to Git LF', 'dependencyOrProductInstrumentation': False}, indent=2) + '\n')
          print('Verified exact canonical maintained source for', len(observed), 'files')
          PYHARNESS
      - run: npm run test:desktop
      - name: Download the already accepted platform-independent client
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux-x64
          repository: JarrettOneSource/solomon-darker-rust
          run-id: 39676774215
          github-token: ${{ github.token }}
          path: incoming-linux
      - name: Verify and extract only its exact client files
        run: python scripts/windows-desktop-diagnostic.py extract-client incoming-linux diagnostic-client reports/desktop-smoke/reused-client.json
      - name: Reuse the exact retained fixed Windows authority
        uses: actions/download-artifact@v4
        with:
          name: windows-fixed-authority-39791414394
          repository: JarrettOneSource/solomon-darker-rust
          run-id: 39791414394
          github-token: ${{ github.token }}
          path: incoming-fixed-native
      - name: Verify the exact fixed native bytes before packaging
        run: |
          python - <<'PYVERIFY'
          from pathlib import Path
          import hashlib
          import shutil
          source = Path('incoming-fixed-native/target/release/solomon-darker.exe')
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          assert actual == '3a39ff6580ebe775bd53663b92855a26cff557e40bd5aa431d7a397237dce730', actual
          target = Path('target/release/solomon-darker.exe')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, target)
          print('Reused exact fixed native executable:', actual)
          PYVERIFY
          python scripts/windows-desktop-diagnostic.py pe-header target/release/solomon-darker.exe reports/desktop-smoke/native-pe-header.json
      - name: Retain the exact fixed native authority before launching Electron
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: windows-fixed-authority-${{ github.run_id }}
          path: |
            target/release/solomon-darker.exe
            reports/desktop-smoke/native-pe-header.json
            reports/desktop-smoke/reused-client.json
          if-no-files-found: error
      - name: Package the native authority with that unchanged client
        run: npm run package:desktop -- --platform win32 --arch x64 --skip-build --native-host target/release/solomon-darker.exe --client-root diagnostic-client --release-repository "$GITHUB_REPOSITORY"
      - name: Add only the existing notice stylesheet and its link to that retained client
        run: python scripts/windows-desktop-diagnostic.py add-notice-style "dist-desktop/Solomon Darker-win32-x64/resources/app/client" reports/desktop-smoke/desktop-update-css-control.json
      - name: Observe the actual packaged offline and peer journey
        timeout-minutes: 14
        run: python scripts/windows-desktop-diagnostic.py smoke reports/desktop-smoke --timeout-seconds 720
      - name: Recover only recorded task-owned processes and print bounded evidence
        if: ${{ always() }}
        timeout-minutes: 2
        run: python scripts/windows-desktop-diagnostic.py recover reports/desktop-smoke
      - name: Retain native process, transport and actual browser evidence
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-diagnostic-${{ github.run_id }}
          path: |
            reports/desktop-smoke
            target/release/solomon-darker.exe
            dist-desktop/Solomon Darker-win32-x64/desktop-package-manifest.json
          if-no-files-found: error
