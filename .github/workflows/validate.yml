{
  "name": "Prove completed-Welcome and failure-reason regressions",
  "on": {
    "push": {
      "branches": [
        "diagnostic/native-admission-20261027"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "CARGO_INCREMENTAL": "0",
    "CARGO_PROFILE_DEV_DEBUG": "0",
    "CARGO_PROFILE_TEST_DEBUG": "0",
    "RUST_BACKTRACE": "1"
  },
  "jobs": {
    "admission-regressions": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "name": "Install the pinned toolchain",
          "run": "rustup show"
        },
        {
          "name": "Install native client build dependencies",
          "run": "sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libfontconfig1-dev libclang-dev cmake"
        },
        {
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": "~/.cargo/registry\n~/.cargo/git\ntarget",
            "key": "game-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}",
            "restore-keys": "game-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-\ngame-${{ runner.os }}-${{ runner.arch }}-"
          }
        },
        {
          "name": "Verify both regressions fail against the unchanged runtime",
          "run": "python3 - <<'PROBE'\nimport hashlib, json, re, subprocess\nfrom pathlib import Path\nout=Path('reports/admission-regressions')\nout.mkdir(parents=True,exist_ok=True)\npaths=['crates/web/src/network/connection.rs','crates/web/src/network/native.rs','crates/web/src/network/native/tests.rs','crates/web/src/network/browser.rs','crates/web/src/game/native.rs']\n(out/'source.json').write_text(json.dumps({'revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'unchangedRuntimeFrom':'23effab6b62fb292998b90ba4a26b38e83d028ba','files':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}},indent=2)+'\\n')\ncommand=['cargo','test','-p','solomon-web','--lib','network::','--','--nocapture']\nresult=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)\n(out/'network-tests.log').write_text(result.stdout)\nprint(result.stdout,flush=True)\nfailed=sorted(re.findall(r'^test (\\S+) \\.\\.\\. FAILED$',result.stdout,re.MULTILINE))\nexpected=sorted(['network::connection::tests::complete_welcome_waits_for_game_acceptance_without_a_receive_timeout','network::native::tests::binary_and_invalid_json_fail_once_and_close_the_socket'])\nreceipt={'command':command,'exitCode':result.returncode,'failedTests':failed,'expectedFailures':expected,'scope':'New behavior assertions against the unchanged traced runtime; no implementation fix'}\n(out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\\n')\nassert result.returncode==101 and failed==expected,receipt\nassert 'The game server handshake timed out.' in result.stdout\nassert 'The game host is not connected' in result.stdout\nassert re.search(r'test result: FAILED\\. \\d+ passed; 2 failed; 0 ignored;',result.stdout)\nPROBE"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "native-admission-regressions",
            "path": "reports/admission-regressions",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
