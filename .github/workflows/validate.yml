{
  "name": "Diagnose Intel native key delivery and frame sampling",
  "on": {
    "push": {
      "branches": [
        "diagnostic/peer-input-20261030"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "observe": {
      "runs-on": "macos-15-intel",
      "timeout-minutes": 120,
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Resolve accessibility interpreter",
          "run": "python3 -c 'import os,sys; print(\"TCC_CLIENT=\" + os.path.realpath(sys.executable))' >> \"$GITHUB_ENV\""
        },
        {
          "uses": "xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d",
          "with": {
            "macos-tcc-client": "${{ env.TCC_CLIENT }}"
          }
        },
        {
          "run": "python3 -m pip install -r tools/desktop-smoke-requirements.txt"
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version-file": ".node-version",
            "cache": "npm",
            "cache-dependency-path": "package-lock.json"
          }
        },
        {
          "run": "npm ci --no-audit --no-fund"
        },
        {
          "name": "Install pinned Rust toolchain",
          "run": "rustup show"
        },
        {
          "name": "Restore existing native dependencies",
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": "~/.cargo/registry\n~/.cargo/git\ntarget",
            "key": "diagnostic-peer-input-${{ github.sha }}",
            "restore-keys": "native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-\nnative-${{ runner.os }}-${{ runner.arch }}-"
          }
        },
        {
          "name": "Check diagnostic source",
          "run": "cargo fmt --all -- --check\ncargo clippy -p solomon-desktop --all-targets -- -D warnings"
        },
        {
          "name": "Build the explicitly unqualified diagnostic package",
          "run": "npm run package:desktop -- --platform darwin --arch x64 --release-repository \"$GITHUB_REPOSITORY\"\nnode tools/archive-desktop.mjs"
        },
        {
          "name": "Validate diagnostic source",
          "run": "python3 -m py_compile tools/diagnostic-peer-input.py\npython3 tools/diagnostic-peer-input.py --check"
        },
        {
          "name": "Observe one full package journey",
          "timeout-minutes": 30,
          "run": "python3 tools/diagnostic-peer-input.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "intel-peer-input-native-trace",
            "path": "reports/desktop-smoke",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  },
  "env": {
    "CARGO_INCREMENTAL": "0",
    "CARGO_PROFILE_DEV_DEBUG": "0",
    "CARGO_PROFILE_TEST_DEBUG": "0",
    "RUST_BACKTRACE": "1"
  }
}
