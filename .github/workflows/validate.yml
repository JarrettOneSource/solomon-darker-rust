{
  "name": "Verify standalone disconnect ordering on Windows",
  "on": {
    "push": {
      "branches": [
        "diagnostic/windows-browser-capture-20261026"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "CARGO_INCREMENTAL": "0",
    "CARGO_PROFILE_DEV_DEBUG": "0",
    "CARGO_PROFILE_TEST_DEBUG": "0",
    "RUST_BACKTRACE": "1"
  },
  "jobs": {
    "desktop-disconnect-windows": {
      "runs-on": "windows-latest",
      "timeout-minutes": 40,
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "9d8c4dccae5d7b859c5185a98296118f0accd233"
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Select native Windows Perl",
          "shell": "pwsh",
          "run": "$nativePerl = (Get-Command perl -All | Where-Object Source -Like '*Strawberry*' | Select-Object -First 1).Source\nif (!$nativePerl) { throw 'The runner has no Strawberry Perl installation.' }\n\"OPENSSL_SRC_PERL=$nativePerl\" >> $env:GITHUB_ENV\n"
        },
        {
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": "~/.cargo/registry\n~/.cargo/git\ntarget",
            "key": "native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-9d8c4dccae5d7b859c5185a98296118f0accd233",
            "restore-keys": "native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-\n"
          }
        },
        {
          "run": "rustup show"
        },
        {
          "name": "Install private condition and exact candidate test patch",
          "shell": "python",
          "run": "from pathlib import Path\nimport hashlib,os,subprocess\nrevision=os.environ['GITHUB_SHA']\nsubprocess.run(['git','fetch','--depth=1','origin',revision],check=True)\nfiles={'tools/diagnostic-desktop-disconnect.py': '4df5ffb1720fff43048232ac170be0d62d655d29dd53b836e8f837ecc570af1c', 'tools/desktop-disconnect-test.patch': 'd1522a108472ccf828d6a05f5ff2965b00722dd4bd9fe1268e65b71b1968f284'}\nfor name,expected in files.items():\n data=subprocess.check_output(['git','show',revision+':'+name])\n assert hashlib.sha256(data).hexdigest()==expected,name\n Path(name).write_bytes(data)\n"
        },
        {
          "name": "Verify controlled red green and ordinary hosted suite",
          "run": "python tools/diagnostic-desktop-disconnect.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "desktop-disconnect-windows",
            "path": "reports/desktop-disconnect",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
