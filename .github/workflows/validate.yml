name: Verify browser admission against real Windows Rust host

on:
  push:
    branches: [diagnostic/windows-browser-capture-20261026]

permissions:
  contents: read
  actions: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  browser-admission:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b8e90930e195b8f74e8492bd0bc6f0c8486940fa
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Select native Windows Perl
        shell: pwsh
        run: |
          $nativePerl = (Get-Command perl -All | Where-Object Source -Like '*Strawberry*' | Select-Object -First 1).Source
          if (!$nativePerl) { throw 'The runner has no Strawberry Perl installation.' }
          "OPENSSL_SRC_PERL=$nativePerl" >> $env:GITHUB_ENV
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-b8e90930e195b8f74e8492bd0bc6f0c8486940fa
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - run: rustup show
      - name: Build real Windows authority
        run: cargo build --locked -p solomon-launcher --bin solomon-darker
      - name: Wait for the already-running exact-source browser build
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json,os,time,urllib.request
          deadline=time.monotonic()+1200
          while True:
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/40432773454/jobs',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response: jobs=json.load(response)['jobs']
              job=next(j for j in jobs if j['name']=='browser-build')
              if job['status']=='completed':
                  assert job['conclusion']=='success',job['conclusion']
                  print('Exact-source browser build complete.');break
              assert time.monotonic()<deadline,'Browser build did not complete within20minutes'
              time.sleep(15)
      - uses: actions/download-artifact@v4
        with:
          name: browser-client-green
          path: web/dist
          run-id: 40432773454
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: browser-green-source
          path: reports/browser-admission/browser-source
          run-id: 40432773454
          github-token: ${{ github.token }}
      - name: Verify browser source and install private ordinary-input fixture
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess,shutil
          root=Path.cwd();output=Path('reports/browser-admission')
          source=json.loads((output/'browser-source/source.json').read_text())
          line_endings=[]
          for name,digest in source['hashes'].items():
              canonical=subprocess.check_output(['git','show','HEAD:'+name])
              actual=Path(name).read_bytes()
              assert hashlib.sha256(canonical).hexdigest()==digest,name
              assert actual.replace(b'\r\n',b'\n')==canonical,name
              if actual!=canonical: line_endings.append(name)
          (output/'checkout-verification.json').write_text(json.dumps({'canonicalSourceHashesMatch':True,'onlyLineEndingsDiffer':line_endings},indent=2)+'\n')
          revision=os.environ['GITHUB_SHA']
          subprocess.run(['git','fetch','--depth=1','origin',revision],check=True)
          fixtures={'tools/browser-smoke/native-admission-acceptance.cjs': 'f063d7ddc8ecf24e5fc0118e7f46bc6ed3ba6ac7d4f70208d6bf9d2fddb5b70e', 'tools/browser-smoke/native-admission-windows.py': 'fceae648a3aa8f3bdb1f61a10c2ed97fde09cda73eeb1570b1f1e002a1dd0489'}
          for name,digest in fixtures.items():
              data=subprocess.check_output(['git','show',revision+':'+name])
              assert hashlib.sha256(data).hexdigest()==digest,name
              Path(name).write_bytes(data)
          shutil.copytree('web/assets','web/dist/assets',dirs_exist_ok=True)
          receipt={'hostSource':'b8e90930e195b8f74e8492bd0bc6f0c8486940fa','browserRun':40432773454,'browserSourceMatchesHostCheckout':True,'fixtureRevision':revision,'fixtureHashes':fixtures,'hostSha256':hashlib.sha256(Path('target/debug/solomon-darker.exe').read_bytes()).hexdigest()}
          (output/'source.json').write_text(json.dumps(receipt,indent=2)+'\n')
      - name: Exercise real browser admission, save and fresh-document continuation
        run: python tools/browser-smoke/native-admission-windows.py
      - name: Retain Windows browser and host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-native-admission-windows
          path: reports/browser-admission
          if-no-files-found: error
