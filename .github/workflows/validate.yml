{
  "name": "Probe native admission during preferences contention",
  "on": {
    "push": {
      "branches": [
        "diagnostic/native-admission-20261027"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "env": {
    "CARGO_INCREMENTAL": "0",
    "CARGO_PROFILE_DEV_DEBUG": "0",
    "CARGO_PROFILE_TEST_DEBUG": "0",
    "RUST_BACKTRACE": "1"
  },
  "jobs": {
    "native-admission": {
      "runs-on": "macos-15-intel",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Resolve accessibility interpreter",
          "run": "python3 -c 'import os,sys; print(\"TCC_CLIENT=\" + os.path.realpath(sys.executable))' >> \"$GITHUB_ENV\""
        },
        {
          "uses": "xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d",
          "with": {
            "macos-tcc-client": "${{ env.TCC_CLIENT }}"
          }
        },
        {
          "run": "python3 -m pip install -r tools/desktop-smoke-requirements.txt"
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "unqualified-native-admission-package",
            "run-id": "40527892687",
            "github-token": "${{ secrets.GITHUB_TOKEN }}",
            "repository": "${{ github.repository }}",
            "path": "diagnostic-package"
          }
        },
        {
          "run": "python3 -m py_compile tools/diagnostic-native-admission.py"
        },
        {
          "name": "Observe contention and recovery with the reviewed executable",
          "timeout-minutes": 20,
          "run": "python3 tools/diagnostic-native-admission.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "native-admission-contention",
            "path": "reports/desktop-smoke",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
