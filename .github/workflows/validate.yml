{
  "name": "Observe held movement after native failure",
  "on": {
    "push": {
      "branches": [
        "diagnostic/windows-browser-capture-20261026"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "native-fatal-held-input": {
      "runs-on": "windows-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "33ca699899158bae7d880a5fda605c92849e7eef"
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d",
          "with": {
            "setup-window-manager": "true"
          }
        },
        {
          "run": "python -m pip install -r tools/desktop-smoke-requirements.txt"
        },
        {
          "uses": "ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72",
          "with": {
            "version": "26.0.3"
          }
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "github-token": "${{ github.token }}",
            "run-id": 40455447684,
            "name": "native-fatal-fixture-executable",
            "path": "retained-executable"
          }
        },
        {
          "name": "Verify retained executable and install private journey",
          "shell": "python",
          "run": "from pathlib import Path\nimport hashlib,json,os,subprocess\nbinaries=list(Path('retained-executable').rglob('*.exe'));assert len(binaries)==1\nbinary=binaries[0].resolve();binary_hash=hashlib.sha256(binary.read_bytes()).hexdigest()\nassert binary_hash=='e1c8ffda82a52d4ead76c9c1662c4177b143ddf7c38f1a9e69853c2b8fe67f1e'\nrevision=os.environ['GITHUB_SHA']\nsubprocess.run(['git','fetch','--depth=1','origin',revision],check=True)\nname='tools/diagnostic-fatal-held-input.py'\ndata=subprocess.check_output(['git','show',revision+':'+name])\nassert hashlib.sha256(data).hexdigest()=='e0e07a7be2db41077c86f2272537798e61b5fa6ae5fe3654e7f05a7800859d32'\nPath(name).write_bytes(data)\nwith open(os.environ['GITHUB_ENV'],'a') as out:\n    out.write('FATAL_NATIVE_APP='+str(binary)+'\\n')\nout=Path('reports/native-fatal-held-input');out.mkdir(parents=True,exist_ok=True)\n(out/'source.json').write_text(json.dumps({'base':'33ca699899158bae7d880a5fda605c92849e7eef','retainedBuildRun':40455447684,'executableSha256':binary_hash,'fixtureRevision':revision,'fixtureSha256':'e0e07a7be2db41077c86f2272537798e61b5fa6ae5fe3654e7f05a7800859d32'},indent=2)+'\\n')\n"
        },
        {
          "name": "Stage unchanged executable and assets",
          "shell": "pwsh",
          "run": "node tools/package-desktop.mjs --platform win32 --arch x64 --native-app \"$env:FATAL_NATIVE_APP\" --release-repository \"$env:GITHUB_REPOSITORY\"\nif ($LASTEXITCODE) { throw \"Retained fixture packaging failed.\" }\n"
        },
        {
          "name": "Compare immediate and delayed recovery while movement was held",
          "shell": "pwsh",
          "run": "python -u tools/diagnostic-fatal-held-input.py\nif ($LASTEXITCODE) { throw \"Held input failure diagnostic failed.\" }\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "native-fatal-held-input-windows",
            "path": "reports/native-fatal-held-input",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
