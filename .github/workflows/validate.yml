name: Distinguish Windows dispatch and listen queue delays

on:
  push:
    branches: [diagnostic/windows-browser-capture-20261026]

permissions:
  contents: read
  actions: read

jobs:
  browser-server:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b8e90930e195b8f74e8492bd0bc6f0c8486940fa
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: browser-client-green
          path: web/dist
          run-id: 40432773454
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: browser-green-source
          path: reports/browser-server/browser-source
          run-id: 40432773454
          github-token: ${{ github.token }}
      - name: Install verified private observation fixture
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess,hashlib,json
          revision=os.environ['GITHUB_SHA']
          subprocess.run(['git','fetch','--depth=1','origin',revision],check=True)
          hashes={'tools/browser-smoke/observe-loading.cjs': '32152d98345751c137a89625a379e308a2b2fb543e507a74ff792eab91d5b074', 'tools/browser-smoke/observe-reload.cjs': '1a12d45b15eb1c790ae3c42d64c3d6515386b3cdbd5c185e1a798b826ae9b6a1', 'tools/browser-smoke/observe-server.py': '2efbcb28b5dd890f76473927e441e0e34f148b01ac829c9734e43c97fe6b792f', 'tools/browser-smoke/observe-windows-processes.py': 'f2ada154b170032db999415c117d5812af95e4d857f035f3548d5eb2a57b9118', 'tools/browser-smoke/observe-server-windows.py': '5436e54e3a17883c6235d3894978f1480d11000932356d86d016538223cab591'}
          for name,digest in hashes.items():
              data=subprocess.check_output(['git','show',revision+':'+name])
              assert hashlib.sha256(data).hexdigest()==digest,name
              Path(name).write_bytes(data)
          out=Path('reports/browser-server');out.mkdir(parents=True,exist_ok=True)
          (out/'source.json').write_text(json.dumps({'base':'b8e90930e195b8f74e8492bd0bc6f0c8486940fa','observationRevision':revision,'fixtureHashes':hashes},indent=2)+'\n')
      - name: Verify exact runtime sources and prepare tracked assets
        shell: python
        run: |
          from pathlib import Path
          import json,hashlib,subprocess,shutil
          source=json.loads(Path('reports/browser-server/browser-source/source.json').read_text())
          for name,digest in source['hashes'].items():
              data=subprocess.check_output(['git','show','HEAD:'+name])
              assert hashlib.sha256(data).hexdigest()==digest,name
          shutil.copytree('web/assets','web/dist/assets',dirs_exist_ok=True)
      - name: Compare queue capacity and owned GPU priority separately
        shell: python
        run: |
          from pathlib import Path
          import json,os,subprocess
          rows=[]
          for name,priority,queue in [('normal-default','normal','default'),('normal-system','normal','system'),('baseline-system','baseline','system'),('normal-system-repeat','normal','system')]:
              env=os.environ.copy();env['OBSERVE_GPU_PRIORITY']=priority;env['OBSERVE_QUEUE_SIZE']=queue
              env['OBSERVE_SERVER_OUT']='reports/browser-server/'+name
              result=subprocess.run(['python','tools/browser-smoke/observe-server-windows.py'],env=env)
              rows.append({'case':name,'exit':result.returncode})
              Path('reports/browser-server/comparison.json').write_text(json.dumps(rows,indent=2)+'\n')
          assert all(row['exit']==0 for row in rows if row['case'] in ['normal-system','normal-system-repeat']),rows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-server-windows
          path: reports/browser-server
          if-no-files-found: error
