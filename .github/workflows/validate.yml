{
  "name": "Verify captured media rewind on Windows",
  "on": {
    "push": {
      "branches": [
        "diagnostic/windows-media-seek-20261027"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "media-seek-windows": {
      "runs-on": "windows-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "22.17.0"
          }
        },
        {
          "name": "Prove captured rewind regression and retained trace results",
          "run": "python tools/diagnostic-media-seek.py red"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "browser-media-seek-windows",
            "path": "reports/media-seek",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
