name: Diagnose Windows browser capture

on:
  push:
    branches: [diagnostic/windows-browser-capture-20261026]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    name: Windows settings trace (${{ matrix.attempt }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        budget: [120000]
        attempt: [7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: browser-client
          path: web/dist
          run-id: 40410527545
          github-token: ${{ github.token }}
      - name: Measure the existing browser journey
        shell: pwsh
        run: |
          Copy-Item web/assets -Destination web/dist -Recurse
          New-Item -ItemType Directory -Force reports/capture | Out-Null
          $env:PW = Join-Path $env:GITHUB_WORKSPACE 'node_modules/playwright-core'
          $env:CHROME = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          $env:URL = 'http://127.0.0.1:4181/'
          $env:OUT = Join-Path $env:GITHUB_WORKSPACE 'reports/capture/settings'
          $env:CAPTURE_TIMEOUT_MS = '${{ matrix.budget }}'
          $server = Start-Process -FilePath (Get-Command python).Source -ArgumentList @('scripts/serve-client.py', '4181', '--bind', '127.0.0.1', '--directory', 'web/dist') -PassThru -RedirectStandardOutput reports/capture/server.log -RedirectStandardError reports/capture/server-error.log
          try {
            $startup = [Diagnostics.Stopwatch]::StartNew()
            $ready = $false
            while (!$ready -and $startup.Elapsed.TotalSeconds -lt 60) {
              if ($server.HasExited) { throw "The owned server exited before listening (code $($server.ExitCode))." }
              $response = $null
              try {
                $response = Invoke-WebRequest -Uri $env:URL -Method Head -TimeoutSec 2 -NoProxy -ErrorAction Stop
              } catch {
                if ($_.Exception.Response) { throw }
                $lastStartupError = $_.Exception.Message
              }
              if ($response) {
                if ($response.StatusCode -ne 200) { throw "Unexpected startup status: $($response.StatusCode)" }
                $ready = $true
              }
              if (!$ready) { Start-Sleep -Milliseconds 200 }
            }
            if (!$ready) { throw "The owned server did not become ready: $lastStartupError" }
            @{ elapsedMs = $startup.ElapsedMilliseconds; status = $response.StatusCode } | ConvertTo-Json | Set-Content reports/capture/server-ready.json
            $env:CAPTURE_JOURNEY = 'settings-parity'
            node tools/browser-smoke/diagnose-screenshot.cjs
            if ($LASTEXITCODE) { throw 'Settings journey failed; inspect retained timings.' }
          } finally {
            if (!$server.HasExited) { Stop-Process -Id $server.Id }
            if (!$server.WaitForExit(10000)) { throw 'The owned diagnostic server did not exit.' }
          }
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-trace-${{ matrix.attempt }}
          path: reports/capture
          if-no-files-found: error

  hosted-transfer:
    if: false
    name: Windows exact checkpoint test validation
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 10f8aa7c7bfec6818de19edde26543b3be8bae23
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select native Windows Perl
        shell: pwsh
        run: |
          $nativePerl = (Get-Command perl -All | Where-Object Source -Like '*Strawberry*' | Select-Object -First 1).Source
          if (!$nativePerl) { throw 'The runner has no Strawberry Perl installation.' }
          "OPENSSL_SRC_PERL=$nativePerl" >> $env:GITHUB_ENV
      - name: Restore exact main native build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-10f8aa7c7bfec6818de19edde26543b3be8bae23
      - run: rustup show
      - name: Validate exact checkpoint test patch
        shell: python
        run: |
          from pathlib import Path
          import hashlib,subprocess,time,json
          root=Path.cwd()
          output=root/'reports/hosted-transfer'
          output.mkdir(parents=True,exist_ok=True)
          source=root/'crates/launcher/tests/hosted_supervisor.rs'
          original=source.read_bytes()
          text=source.read_text()
          needle='    fn until(&mut self, accept: impl Fn(&ServerMessage<Value>) -> bool) -> ServerMessage<Value> {\n        if let Some(index) = self.pending.iter().position(&accept) {'
          replacement='    fn until(&mut self, accept: impl Fn(&ServerMessage<Value>) -> bool) -> ServerMessage<Value> {\n        self.until_with_timeout(Duration::from_secs(8), accept)\n    }\n\n    #[track_caller]\n    fn until_with_timeout(\n        &mut self,\n        timeout: Duration,\n        accept: impl Fn(&ServerMessage<Value>) -> bool,\n    ) -> ServerMessage<Value> {\n        if let Some(index) = self.pending.iter().position(&accept) {'
          assert text.count(needle)==1
          text=text.replace(needle,replacement)
          needle='        let progress_before = self.save_progress;\n        let deadline = Instant::now() + Duration::from_secs(8);'
          assert text.count(needle)==1
          text=text.replace(needle,'        let progress_before = self.save_progress;\n        let deadline = Instant::now() + timeout;')
          needle='    let ServerMessage::BoneyardLoaded { boneyard: party_world } = message else { unreachable!() };\n    let message = h2.until(|message| {'
          replacement='    let ServerMessage::BoneyardLoaded { boneyard: party_world } = message else { unreachable!() };\n    // This acknowledged Boneyard transfer measured 8.4 seconds in Windows debug CI.\n    let message = h2.until_with_timeout(Duration::from_secs(30), |message| {'
          assert text.count(needle)==1
          text=text.replace(needle,replacement)
          tested_sha=hashlib.sha256(text.encode()).hexdigest()
          assert tested_sha=='bacb64192e79084a1fbbfbd4abb2efdd39fc689dbfd60e8fe3ff8010efbdc202'
          source.write_bytes(text.encode())
          archive_source=root/'crates/launcher/src/host/run_archive/store.rs'
          archive_original=archive_source.read_bytes()
          archive_text=archive_source.read_text()
          needle='        let mut builder = DirBuilder::new();'
          assert archive_text.count(needle)==1
          archive_text=archive_text.replace(needle,'        let builder = &mut DirBuilder::new();')
          archive_sha=hashlib.sha256(archive_text.encode()).hexdigest()
          assert archive_sha=='235d5b4520e03ec2e41afc6e3492a61b5eaadf1101cba999df6e7b7e148e5e65'
          archive_source.write_bytes(archive_text.encode())
          commands=[
           ['cargo','fmt','--all','--','--check'],
           ['cargo','clippy','-p','solomon-launcher','--test','hosted_supervisor','--all-features','--','-D','warnings'],
           ['cargo','test','--workspace','--all-features'],
           ['cargo','test','-p','solomon-launcher','--test','hosted_supervisor','--all-features'],
           ['cargo','test','-p','solomon-launcher','--test','hosted_supervisor','--all-features'],
          ]
          rows=[]
          try:
           for index,cmd in enumerate(commands,1):
            started=time.monotonic();log=output/f'{index}-validation.log'
            with log.open('w') as out:
             result=subprocess.run(cmd,cwd=root,stdout=out,stderr=subprocess.STDOUT)
            row={'attempt':index,'command':cmd,'exit':result.returncode,'elapsedSeconds':round(time.monotonic()-started,3),'log':log.name}
            rows.append(row);print(json.dumps(row),flush=True)
            if result.returncode: break
          finally:
           source.write_bytes(original)
           archive_source.write_bytes(archive_original)
           assert source.read_bytes()==original
           assert archive_source.read_bytes()==archive_original
           receipt={'baseRevision':'10f8aa7c7bfec6818de19edde26543b3be8bae23','change':'Exact proposed checkpoint test patch plus the Windows directory-builder lint fix; no private instrumentation.','testedSourceSha256':tested_sha,'archiveSourceSha256':archive_sha,'sourceRestoredSha256':hashlib.sha256(source.read_bytes()).hexdigest(),'attempts':rows,'passed':len(rows)==len(commands) and all(r['exit']==0 for r in rows)}
           (output/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
           print(json.dumps(receipt),flush=True)
          raise SystemExit(not receipt['passed'])
      - name: Retain transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-transfer-validation-windows
          path: reports/hosted-transfer
          if-no-files-found: error

  native-peer:
    if: false
    name: Apple silicon peer input trace
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 99a3973a394f320d8875839f61710aa12de6da1e
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve the accessibility interpreter
        run: python -c 'import os,sys; print("TCC_CLIENT=" + os.path.realpath(sys.executable))' >> "$GITHUB_ENV"
      - name: Prepare native accessibility
        uses: xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d
        with:
          setup-window-manager: 'true'
          macos-tcc-client: ${{ env.TCC_CLIENT }}
      - run: python -m pip install -r tools/desktop-smoke-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-desktop-darwin-arm64-40421722520-1
          path: diagnostic-artifact
          run-id: 40421722520
          github-token: ${{ github.token }}
      - name: Check and extract the immutable package
        shell: python
        run: |
          from pathlib import Path
          import hashlib,subprocess
          root=Path('diagnostic-artifact')
          archive=root/'Solomon-Darker-darwin-arm64.zip'
          expected=(root/'Solomon-Darker-darwin-arm64.zip.sha256').read_text().split()[0]
          with archive.open('rb') as f:
              assert hashlib.file_digest(f,'sha256').hexdigest()==expected
          subprocess.run(['ditto','-x','-k',str(archive),'dist-desktop'],check=True)
      - name: Observe existing peer input and checkpoints
        shell: python
        run: |
          from pathlib import Path
          import ast,json,os,subprocess,sys,time
          source=Path('tools/smoke-desktop-runtime.py')
          original=source.read_bytes()
          text=source.read_text()
          needle='    for app in (host, guest):\n        app.activate()\n        read_ui(app.control("match-loading").wait_detached, timeout=120)'
          replacement='    RECEIPT["peerStart"] = {"runId": run_id, "beforeX": before_x,\n                            "initialTicks": initial_ticks,\n                            "playing": {app.name: diagnostic_state(app) for app in (host, guest)}}\n    for app in (host, guest):\n        app.activate()\n        read_ui(app.control("match-loading").wait_detached, timeout=120)'
          assert text.count(needle)==1
          text=text.replace(needle,replacement)
          needle='try:\n    check_package()\n    check_offline()\n    check_peers()'
          replacement='\ndef diagnostic_state(app):\n    record = save_record(app.profile)\n    if record is None:\n        return None\n    document = record[1]\n    return {"revision": record[0]["revision"],\n            "tick": document["continuation"]["simulation"]["tick"],\n            "position": player(document)["locomotions"]["position"]}\n\noriginal_hold = Application.hold\ndef diagnostic_hold(app, key, seconds):\n    row = {"name": app.name, "key": key, "seconds": seconds,\n           "before": diagnostic_state(app)}\n    start = time.monotonic()\n    try:\n        return original_hold(app, key, seconds)\n    finally:\n        row["elapsedSeconds"] = time.monotonic() - start\n        row["after"] = diagnostic_state(app)\n        RECEIPT.setdefault("keyHolds", []).append(row)\n        print("NATIVE_INPUT_DIAGNOSTIC " + json.dumps(row), flush=True)\nApplication.hold = diagnostic_hold\n\noriginal_capture = Application.capture\ndef diagnostic_capture(app, name, activate=True):\n    result = original_capture(app, name, activate)\n    row = {"name": app.name, "capture": name, "after": diagnostic_state(app)}\n    RECEIPT.setdefault("captureStates", []).append(row)\n    print("NATIVE_INPUT_DIAGNOSTIC " + json.dumps(row), flush=True)\n    return result\nApplication.capture = diagnostic_capture\n\n'+'try:\n    check_package()\n    assert MANIFEST["revision"] == "99a3973a394f320d8875839f61710aa12de6da1e"\n    check_peers()'
          assert text.count(needle)==1
          text=text.replace(needle,replacement)
          ast.parse(text)
          source.write_text(text)
          rows=[]
          try:
           for attempt in (1,2):
            output=Path('reports/native-peer')/str(attempt)
            output.mkdir(parents=True,exist_ok=True)
            env=os.environ.copy();env['SDR_DESKTOP_EVIDENCE']=str(output.resolve())
            started=time.monotonic()
            with (output/'driver.log').open('w') as log:
             result=subprocess.run([sys.executable,str(source)],env=env,stdout=log,stderr=subprocess.STDOUT)
            row={'attempt':attempt,'exit':result.returncode,'elapsedSeconds':time.monotonic()-started}
            rows.append(row);print(json.dumps(row),flush=True)
          finally:
           source.write_bytes(original)
           assert source.read_bytes()==original
           Path('reports/native-peer/diagnostic.json').write_text(json.dumps({'immutablePackage':'99a3973a394f320d8875839f61710aa12de6da1e','changes':'Observe unchanged 1.2-second key holds and saved positions; run only the existing peer journey twice.','attempts':rows},indent=2)+'\n')
          raise SystemExit(any(row['exit'] for row in rows))
      - name: Retain native peer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-peer-trace
          path: reports/native-peer
          if-no-files-found: error
