{
  "name": "Verify held input across measured software-rendered frames",
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "env": {
    "CARGO_INCREMENTAL": "0",
    "CARGO_PROFILE_DEV_DEBUG": "0",
    "CARGO_PROFILE_TEST_DEBUG": "0",
    "RUST_BACKTRACE": "1"
  },
  "jobs": {
    "native-input-hold-arm": {
      "runs-on": "macos-15",
      "timeout-minutes": 30,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "33ca699899158bae7d880a5fda605c92849e7eef"
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Resolve the accessibility interpreter",
          "run": "python -c 'import os,sys; print(\"TCC_CLIENT=\" + os.path.realpath(sys.executable))' >> \"$GITHUB_ENV\""
        },
        {
          "uses": "xa11y/setup-a11y@0dad2b7bb4c0d4601e99e53d9b42b3195274aa3d",
          "with": {
            "setup-window-manager": "true",
            "macos-tcc-client": "${{ env.TCC_CLIENT }}"
          }
        },
        {
          "run": "python -m pip install -r tools/desktop-smoke-requirements.txt"
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version-file": ".node-version",
            "cache": "npm"
          }
        },
        {
          "run": "npm ci --no-audit --no-fund"
        },
        {
          "name": "Install verified held-input check",
          "id": "fixture",
          "shell": "python",
          "run": "from pathlib import Path\nimport hashlib,json,os,subprocess\nrevision=os.environ['GITHUB_SHA']\nsubprocess.run(['git','fetch','--depth=1','origin',revision],check=True)\nname='tools/diagnostic-native-focus.py'\ndata=subprocess.check_output(['git','show',revision+':'+name])\nassert hashlib.sha256(data).hexdigest()=='17949f3279926044cb4a48e22d769c3d0ca3882add2c6389097723a2a6c1a062'\nPath(name).write_bytes(data)\nout=Path('reports/native-focus');out.mkdir(parents=True,exist_ok=True)\n(out/'source.json').write_text(json.dumps({'sourceRevision':'33ca699899158bae7d880a5fda605c92849e7eef','fixtureRevision':revision,'fixtureSha256':'17949f3279926044cb4a48e22d769c3d0ca3882add2c6389097723a2a6c1a062','executableRun':40457941650,'scope':'Unchanged private trace executable; three-second peer key hold, all movement/save checks retained'},indent=2)+'\\n')\n"
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "github-token": "${{ github.token }}",
            "run-id": 40457941650,
            "name": "native-input-arm-executable",
            "path": "retained-executable"
          }
        },
        {
          "name": "Verify and package the unchanged traced executable",
          "id": "build",
          "shell": "python",
          "run": "from pathlib import Path\nimport hashlib,json,subprocess\np=Path('retained-executable/solomon-darker-app')\nassert hashlib.sha256(p.read_bytes()).hexdigest()=='5f6f7d51b32b4750e3350d6440549b12325d6a2880f17acc4139075096906199'\np.chmod(0o755)\nsubprocess.run(['node','tools/package-desktop.mjs','--platform','darwin','--arch','arm64','--native-app',str(p.resolve()),'--release-repository','JarrettOneSource/solomon-darker-rust'],check=True)\npackage=Path('dist-desktop/Solomon Darker-darwin-arm64')\nmanifest=json.loads((package/'desktop-package-manifest.json').read_text())\nstaged=package/manifest['executable']\nassert hashlib.sha256(staged.read_bytes()).hexdigest()=='f9119bbfefb243cb630f60a7ee3f3cd50bc20586516c18deda0a322861fed01d'\n"
        },
        {
          "name": "Sample first three-second peer hold",
          "run": "python -u tools/diagnostic-native-focus.py hold-one"
        },
        {
          "name": "Sample second three-second peer hold",
          "if": "always() && steps.build.outcome == 'success'",
          "run": "python -u tools/diagnostic-native-focus.py hold-two"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "native-input-hold-arm",
            "path": "reports/native-focus",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  },
  "on": {
    "push": {
      "branches": [
        "diagnostic/windows-browser-capture-20261026"
      ]
    }
  }
}
