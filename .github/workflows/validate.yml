name: Diagnose Windows scheduling and resource pressure
on:
  push:
    branches: [diagnostic/windows-scheduling-33f64b2]
permissions:
  contents: read
  actions: read
jobs:
  windows-input:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: unqualified-desktop-win32-x64-40155018342-1
          run-id: 40155018342
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify and extract the exact failed candidate
        run: |
          cd candidate
          sha256sum --check Solomon-Darker-win32-x64.zip.sha256
          mkdir ../dist-desktop
          python -c "import zipfile; zipfile.ZipFile('Solomon-Darker-win32-x64.zip').extractall('../dist-desktop')"
          cd ..
          python - <<'VERIFY'
          import json, pathlib, hashlib
          root=pathlib.Path('dist-desktop/Solomon Darker-win32-x64')
          m=json.loads((root/'desktop-package-manifest.json').read_text())
          assert m['revision']=='33f64b23123763fe47fa8f1ecf8bee0dca696b7b'
          native=root/'resources/app'/m['nativeAuthority']['executable']
          assert hashlib.file_digest(native.open('rb'),'sha256').hexdigest()==m['nativeAuthority']['sha256']=='7b5f48787bb925de3dc45626be77bf268c31bfa03f7ec0e081b294545cf41ac2'
          VERIFY
      - name: Compare normal and above-normal automation priority
        run: python tools/observe-windows-runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-scheduling-33f64b2
          path: reports/windows-input
          if-no-files-found: error
