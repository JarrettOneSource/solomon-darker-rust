[package]
name = "solomon-graphics"
description = "Shared WebGL2 stock renderer and browser asset decoding"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[example]]
name = "composition_probe"
crate-type = ["cdylib"]

[dependencies]
solomon-sim = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
  "Window", "Document", "HtmlElement", "Element", "Node", "Response", "HtmlImageElement", "WebGl2RenderingContext", "WebGlBuffer",
  "WebGlFramebuffer", "WebGlProgram", "WebGlShader", "WebGlTexture", "WebGlSampler",
  "WebGlUniformLocation", "WebGlVertexArrayObject",
] }
