[package]
name = "solomon-loader"
description = "Stock GPU startup splash before the main game module loads"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
solomon-sim = { workspace = true }
solomon-graphics = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = { workspace = true }
web-sys = { workspace = true, features = [
  "Window", "Document", "HtmlElement", "HtmlCanvasElement", "Element", "Node", "EventTarget",
  "WebGl2RenderingContext", "HtmlImageElement", "KeyboardEvent", "CssStyleDeclaration",
  "Blob", "BlobPropertyBag", "Url",
] }
