[package]
name = "solomon-sim"
description = "Deterministic Solomon Dark simulation kernels, ported from the native-verified reference"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
persistence = ["dep:serde"]

[dependencies]
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std"] }
ryu-js = "1.0.3"
serde = { workspace = true, optional = true, features = ["rc"] }

[dev-dependencies]
miniz_oxide = "0.8.9"
serde = { workspace = true }
serde_json = { workspace = true }
