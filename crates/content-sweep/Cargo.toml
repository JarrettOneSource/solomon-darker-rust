[package]
name = "solomon-content-sweep"
description = "Checks that the mods and Boneyards published on the Website load in the Rust game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
solomon-launcher = { path = "../launcher" }
solomon-modding = { path = "../modding" }
solomon-sim = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23"
flate2 = "1.1"
# The published listing is HTTPS. TLS stays in this tool so the hosted authority, which
# only posts to loopback, keeps its own build without it.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
