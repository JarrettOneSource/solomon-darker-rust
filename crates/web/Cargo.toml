[package]
name = "solomon-web"
description = "Browser client for the Rust Solomon Dark rebuild (WebAssembly + WebGL2)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
browser-fixtures = []

[dependencies]
solomon-graphics = { workspace = true }
solomon-sim = { workspace = true, features = ["persistence"] }
solomon-assets = { workspace = true }
solomon-protocol = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
web-sys = { workspace = true, features = [
  "AbortController", "AbortSignal", "Window", "VisualViewport", "MediaQueryList", "Document", "Element", "HtmlElement", "Node", "HtmlCanvasElement", "HtmlImageElement",
  "CanvasRenderingContext2d", "CanvasPattern", "ImageData", "TextMetrics",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlTexture",
  "WebGlUniformLocation", "WebGlVertexArrayObject", "WebGlFramebuffer",
  "KeyboardEvent", "Event", "EventTarget", "Performance", "Response", "Request", "RequestInit", "CompositionEvent", "InputEvent", "ClipboardEvent", "DataTransfer", "FontFace", "FontFaceSet", "FontFaceDescriptors",
  "console", "CssStyleDeclaration", "Crypto",
  "Location", "History", "Url", "UrlSearchParams", "WebSocket", "MessageEvent", "CloseEvent", "Headers", "RequestCredentials",
  "Navigator", "Clipboard", "Gamepad", "GamepadButton", "GamepadMappingType", "PointerEvent", "MouseEvent", "DomRect",
  "HtmlInputElement", "HtmlSelectElement", "HtmlIFrameElement", "FocusOptions", "File", "FileList", "Blob", "BlobPropertyBag", "HtmlAnchorElement", "HtmlTextAreaElement", "HtmlDialogElement", "DomTokenList", "NodeList", "HtmlCollection", "WheelEvent",
  "Storage", "StorageEvent", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest",
  "IdbObjectStore", "IdbObjectStoreParameters", "IdbTransaction", "IdbTransactionMode", "DomException",
  "AudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode",
  "AudioScheduledSourceNode", "AudioNode", "AudioDestinationNode", "AudioParam",
  "GainNode", "HtmlAudioElement", "HtmlMediaElement",
  "Cache", "CacheStorage", "RequestCache", "SubtleCrypto", "Blob", "BlobPropertyBag",
  "ReadableStream", "ReadableStreamDefaultReader",
] }
