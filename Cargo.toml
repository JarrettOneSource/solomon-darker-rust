[workspace]
resolver = "3"
members = ["crates/sim", "crates/assets", "crates/graphics", "crates/loader", "crates/web", "crates/launcher", "crates/protocol", "crates/modding", "crates/save-tools"]
exclude = ["vendor/egui"]

[patch.crates-io]
egui = { path = "vendor/egui" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
solomon-graphics = { path = "crates/graphics" }
solomon-sim = { path = "crates/sim" }
solomon-assets = { path = "crates/assets" }
solomon-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
